<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --body-bg: #1c1d1f;
    --case: #232427;
    --case-edge: #2d2e32;
    --screen-bg: #cfd9c6;
    --screen-ink: #22301f;
    --key: #3a3c41;
    --key-hi: #46484e;
    --op: #e8823c;
    --op-hi: #f2954f;
    --danger: #d9534f;
    --text-soft: #9a9ca3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--body-bg);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    padding: 32px 16px;
  }
  .unit{
    width: 380px;
    max-width: 100%;
    background: linear-gradient(180deg, var(--case-edge), var(--case));
    border-radius: 22px;
    padding: 22px 20px 26px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .brand{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 2px 4px 14px;
  }
  .brand-name{
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--text-soft);
  }
  .brand-model{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-soft);
  }
  .screen{
    background: var(--screen-bg);
    border-radius: 10px;
    padding: 16px 16px 14px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.35);
    margin-bottom: 16px;
  }
  .screen-row{
    display:flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .screen-label{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #4c5c47;
    letter-spacing: 0.04em;
    margin-bottom: 2px;
  }
  .operand-inputs{
    display:flex;
    gap: 10px;
    margin-bottom: 10px;
  }
  .operand{
    flex: 1;
    min-width: 0;
  }
  .operand input{
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(34,48,31,0.25);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    color: var(--screen-ink);
    padding: 4px 2px 6px;
    outline: none;
  }
  .operand input::placeholder{ color: rgba(34,48,31,0.35); }
  .result-line{
    border-top: 1px dashed rgba(34,48,31,0.3);
    margin-top: 8px;
    padding-top: 10px;
    min-height: 34px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 26px;
    color: var(--screen-ink);
    text-align: right;
    word-break: break-all;
    transition: opacity 0.15s ease;
  }
  .result-line.pending{ opacity: 0.4; }
  .result-line.err{ color: var(--danger); font-size: 15px; text-align: left; }

  .pad{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
  }
  button.key{
    appearance:none;
    border:none;
    border-radius: 10px;
    padding: 14px 6px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #e7e7ea;
    background: linear-gradient(180deg, var(--key-hi), var(--key));
    box-shadow: 0 2px 0 rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.05);
    cursor: pointer;
    transition: transform 0.05s ease, box-shadow 0.05s ease, background 0.15s ease;
  }
  button.key:active{
    transform: translateY(2px);
    box-shadow: 0 0 0 rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  button.key.op{
    background: linear-gradient(180deg, var(--op-hi), var(--op));
    color: #241202;
    font-weight: 600;
  }
  button.key.wide{ grid-column: span 2; }
  button.key:disabled{ opacity: 0.5; cursor: default; }

  .hint{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--text-soft);
    margin-top: 14px;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>

<div class="unit">
  <div class="brand">
    <div class="brand-name">CALC/MCP</div>
    <div class="brand-model">MODEL 8-OP</div>
  </div>

  <div class="screen">
    <div class="operand-inputs">
      <div class="operand">
        <div class="screen-label">A</div>
        <input type="number" id="a" placeholder="0" step="any" inputmode="decimal">
      </div>
      <div class="operand">
        <div class="screen-label">B</div>
        <input type="number" id="b" placeholder="0" step="any" inputmode="decimal">
      </div>
    </div>
    <div class="result-line" id="result">—</div>
  </div>

  <div class="pad">
    <button class="key op" data-op="add">+</button>
    <button class="key op" data-op="subtract">−</button>
    <button class="key op" data-op="multiply">×</button>
    <button class="key op" data-op="divide">÷</button>
    <button class="key" data-op="power">a^b</button>
    <button class="key" data-op="modulo">a mod b</button>
    <button class="key" data-op="square">a²</button>
    <button class="key" data-op="cube">a³</button>
    <button class="key wide" id="clear">Clear</button>
  </div>

  <div class="hint">served via Flask · computed via MCP tool call</div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
